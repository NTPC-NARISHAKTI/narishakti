<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marketplace - User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/user-styles.css">
</head>
<body>
    <!-- Auth Container -->
    <div id="authContainer" class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="bi bi-shop"></i> Marketplace
            </div>
            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Register</button>
                </li>
            </ul>
            <div class="tab-content mt-4">
                <!-- Login Form -->
                <div class="tab-pane fade show active" id="login" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="tab-pane fade" id="register" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="registerName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Employee ID</label>
                            <input type="text" class="form-control" id="registerEmpNo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="registerEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="registerPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="registerConfirmPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Project</label>
                            <select class="form-control" id="registerProject" required>
                                <option value="">Select a project</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                </div>
            </div>
            <div id="authMessage" class="mt-3"></div>
        </div>
    </div>

    <!-- User Dashboard -->
    <div id="userDashboard" style="display: none;">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo-section">
                    <i class="bi bi-shop"></i>
                    <span>Marketplace</span>
                </div>
                <div class="user-section">
                    <span id="userInfo" class="user-name">Welcome, User</span>
                    <button onclick="logout()" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Marketplace Section -->
            <section id="marketplace" class="section active">
                <div class="section-header">
                    <h2><i class="bi bi-grid-fill"></i> Marketplace</h2>
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="Search products...">
                    </div>
                </div>
                
                <div id="marketplaceMessage"></div>
                
                <!-- Recent Activity Section -->
                <div class="recent-activity-section mb-4">
                    <h4 class="activity-title"><i class="bi bi-clock-history"></i> Recent Activity</h4>
                    <div class="activity-feed" id="recentActivity">
                        <!-- Recent orders will be loaded here -->
                    </div>
                </div>
                
                <div class="products-grid" id="productsGrid">
                    <!-- Products will be loaded here -->
                    <div class="skeleton-container">
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                    </div>
                </div>
                
                <div id="loadMoreContainer" style="display: none;">
                    <button class="btn btn-outline-primary btn-load-more" onclick="loadMoreProducts()">
                        Load More
                    </button>
                </div>
            </section>

            <!-- Orders Section -->
            <section id="orders" class="section">
                <div class="section-header">
                    <h2><i class="bi bi-bag-fill"></i> My Orders</h2>
                </div>
                
                <div id="ordersMessage"></div>
                
                <div class="orders-list" id="ordersList">
                    <!-- Orders will be loaded here -->
                </div>
                
                <div class="empty-state" id="ordersEmpty" style="display: none;">
                    <i class="bi bi-bag-x"></i>
                    <h4>No orders yet</h4>
                    <p>Start shopping to see your orders here</p>
                    <button class="btn btn-primary" onclick="switchSection('marketplace')">
                        Browse Products
                    </button>
                </div>
            </section>

            <!-- Profile Section -->
            <section id="profile" class="section">
                <div class="section-header">
                    <h2><i class="bi bi-person-fill"></i> My Profile</h2>
                </div>
                
                <div id="profileMessage"></div>
                
                <div class="profile-card">
                    <div class="profile-avatar">
                        <img id="profileAvatar" src="https://ui-avatars.com/api/?name=User&background=3498db&color=fff" alt="Profile">
                        <label for="avatarUpload" class="avatar-edit">
                            <i class="bi bi-camera"></i>
                        </label>
                        <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
                    </div>
                    
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Employee ID</label>
                            <input type="text" id="profileEmpNo" class="form-control" readonly>
                        </div>
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="profileName" class="form-control" readonly>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="profileEmail" class="form-control" readonly>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="profilePhone" class="form-control" placeholder="Enter phone number">
                        </div>
                        <div class="form-group">
                            <label>Project</label>
                            <input type="text" id="profileProject" class="form-control" readonly>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="bi bi-save"></i> Save Changes
                        </button>
                    </form>
                </div>
            </section>

            <!-- Project Members Section -->
            <section id="members" class="section">
                <div class="section-header">
                    <h2><i class="bi bi-people-fill"></i> Project Members</h2>
                </div>
                
                <div id="membersMessage"></div>
                
                <div class="members-grid" id="membersGrid">
                    <!-- Members will be loaded here -->
                </div>
                
                <div class="empty-state" id="membersEmpty" style="display: none;">
                    <i class="bi bi-people"></i>
                    <h4>No members found</h4>
                    <p>Your project team will appear here</p>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation (Mobile) -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" onclick="switchSection('marketplace')">
                <i class="bi bi-grid-fill"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item" onclick="switchSection('orders')">
                <i class="bi bi-bag-fill"></i>
                <span>Orders</span>
            </a>
            <a href="#" class="nav-item" onclick="switchSection('profile')">
                <i class="bi bi-person-fill"></i>
                <span>Profile</span>
            </a>
            <a href="#" class="nav-item" onclick="switchSection('members')">
                <i class="bi bi-people-fill"></i>
                <span>Team</span>
            </a>
        </nav>
    </div>

    <!-- Order Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Place Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="order-product-info" id="orderProductInfo">
                        <!-- Product info will be inserted here -->
                    </div>
                    <form id="orderForm">
                        <input type="hidden" id="orderPostId">
                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <div class="quantity-selector">
                                <button type="button" class="btn btn-outline-secondary" onclick="updateQuantity(-1)">-</button>
                                <input type="number" id="orderQuantity" class="form-control text-center" value="1" min="1">
                                <button type="button" class="btn btn-outline-secondary" onclick="updateQuantity(1)">+</button>
                            </div>
                            <small class="text-muted" id="availableQty">Available: 0</small>
                        </div>
                        <div class="order-total">
                            <span>Total:</span>
                            <strong id="orderTotal">$0.00</strong>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitOrder()">Place Order</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert">
            <div class="toast-body" id="toastMessage">
                <!-- Toast message -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/user-app.js"></script>
</body>
</html>
